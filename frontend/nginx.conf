server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Serve frontend files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy analytics requests to analytics collector service
    location /api/analytics {
        proxy_pass http://analytics-collector-service:3004/analytics;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy other API requests to respective services
    location /api/events {
        proxy_pass http://event-service:3001;
        proxy_set_header Host $host;
    }

    location /api/programs {
        proxy_pass http://program-service:3002;
        proxy_set_header Host $host;
    }

    location /api/register {
        proxy_pass http://registration-service:3003;
        proxy_set_header Host $host;
    }
}