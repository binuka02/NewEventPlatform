server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    resolver kube-dns.kube-system.svc.cluster.local valid=10s;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/analytics {
        set $analytics "analytics-collector-service.analytics.svc.cluster.local:3004";
        proxy_pass http://$analytics/analytics;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @analytics_fallback;
    }

    location @analytics_fallback {
        return 200 '{"success":true,"message":"Analytics queued"}';
        add_header Content-Type application/json;
    }

    location /api/events {
        set $events "event-service.production.svc.cluster.local:3001";
        rewrite ^/api/events(.*) /events$1 break;
        proxy_pass http://$events;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location /api/programs {
        set $programs "program-service.production.svc.cluster.local:3002";
        rewrite ^/api/programs(.*) /programs$1 break;
        proxy_pass http://$programs;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location /api/registrations {
        set $register "registration-service.production.svc.cluster.local:3003";
        rewrite ^/api/registrations(.*) /registrations$1 break;
        proxy_pass http://$register;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location /api/register {
        set $register "registration-service.production.svc.cluster.local:3003";
        proxy_pass http://$register/register;
        proxy_set_header Host $host;
        proxy_set_header Content-Type $content_type;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
}