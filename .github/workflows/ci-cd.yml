name: CI/CD Pipeline - New Event Platform

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DOCKERHUB_USERNAME: binukx
  EKS_CLUSTER_NAME: new-event-cluster
  AWS_REGION: us-east-1

jobs:
  # ============================================
  # JOB 1: Build and Test
  # ============================================
  build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tag
        id: vars
        run: echo "TAG=$(echo $GITHUB_SHA | head -c7)" >> $GITHUB_OUTPUT

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/new-event-frontend:${{ steps.vars.outputs.TAG }}
            ${{ env.DOCKERHUB_USERNAME }}/new-event-frontend:latest

      - name: Build and push Event Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/event-service
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/event-service:${{ steps.vars.outputs.TAG }}
            ${{ env.DOCKERHUB_USERNAME }}/event-service:latest

      - name: Build and push Program Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/program-service
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/program-service:${{ steps.vars.outputs.TAG }}
            ${{ env.DOCKERHUB_USERNAME }}/program-service:latest

      - name: Build and push Registration Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/registration-service
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/registration-service:${{ steps.vars.outputs.TAG }}
            ${{ env.DOCKERHUB_USERNAME }}/registration-service:latest

      - name: Build and push Analytics Collector
        uses: docker/build-push-action@v5
        with:
          context: ./services/analytics-collector
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/analytics-collector:${{ steps.vars.outputs.TAG }}
            ${{ env.DOCKERHUB_USERNAME }}/analytics-collector:latest

  # ============================================
  # JOB 2: Blue-Green Deployment
  # ============================================
  deploy:
    name: Blue-Green Deployment
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Set image tag
        id: vars
        run: echo "TAG=$(echo $GITHUB_SHA | head -c7)" >> $GITHUB_OUTPUT

      - name: Determine current active color
        id: color
        run: |
          CURRENT=$(kubectl get service frontend-service -n production -o jsonpath='{.spec.selector.version}' 2>/dev/null || echo "blue")
          if [ "$CURRENT" == "blue" ]; then
            echo "DEPLOY_COLOR=green" >> $GITHUB_OUTPUT
            echo "ACTIVE_COLOR=blue" >> $GITHUB_OUTPUT
          else
            echo "DEPLOY_COLOR=blue" >> $GITHUB_OUTPUT
            echo "ACTIVE_COLOR=green" >> $GITHUB_OUTPUT
          fi
          echo "Current active: $CURRENT"

      - name: Deploy to inactive color
        run: |
          DEPLOY_COLOR=${{ steps.color.outputs.DEPLOY_COLOR }}
          TAG=${{ steps.vars.outputs.TAG }}
          echo "Deploying to $DEPLOY_COLOR with tag $TAG"

          # Update the inactive deployment with new image
          kubectl set image deployment/frontend-$DEPLOY_COLOR \
            frontend=binukx/new-event-frontend:$TAG \
            -n production

          # Scale up inactive deployment
          kubectl scale deployment frontend-$DEPLOY_COLOR --replicas=2 -n production

          # Wait for rollout to complete
          kubectl rollout status deployment/frontend-$DEPLOY_COLOR -n production --timeout=300s

      - name: Switch traffic to new version
        run: |
          DEPLOY_COLOR=${{ steps.color.outputs.DEPLOY_COLOR }}
          echo "Switching traffic to $DEPLOY_COLOR"

          # Patch the service to point to new color
          kubectl patch service frontend-service -n production \
            -p "{\"spec\":{\"selector\":{\"app\":\"frontend\",\"version\":\"$DEPLOY_COLOR\"}}}"

          echo "Traffic switched to $DEPLOY_COLOR successfully!"

      - name: Scale down old version
        run: |
          ACTIVE_COLOR=${{ steps.color.outputs.ACTIVE_COLOR }}
          echo "Scaling down old $ACTIVE_COLOR deployment"
          kubectl scale deployment frontend-$ACTIVE_COLOR --replicas=0 -n production

      - name: Deploy backend services
        run: |
          TAG=${{ steps.vars.outputs.TAG }}

          # Update all backend services
          kubectl set image deployment/event-service \
            event-service=binukx/event-service:$TAG -n production
          kubectl set image deployment/program-service \
            program-service=binukx/program-service:$TAG -n production
          kubectl set image deployment/registration-service \
            registration-service=binukx/registration-service:$TAG -n production
          kubectl set image deployment/analytics-collector \
            analytics-collector=binukx/analytics-collector:$TAG -n analytics

          # Wait for all rollouts
          kubectl rollout status deployment/event-service -n production --timeout=300s
          kubectl rollout status deployment/program-service -n production --timeout=300s
          kubectl rollout status deployment/registration-service -n production --timeout=300s
          kubectl rollout status deployment/analytics-collector -n analytics --timeout=300s

      - name: Verify deployment
        run: |
          echo "=== All Pods ==="
          kubectl get pods -n production
          kubectl get pods -n analytics
          echo "=== Services ==="
          kubectl get services -n production
          echo "=== Deployment complete! ==="