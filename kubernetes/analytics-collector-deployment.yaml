apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-collector-blue
  namespace: analytics
  labels:
    app: analytics-collector
    version: blue
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: analytics-collector
      version: blue
  template:
    metadata:
      labels:
        app: analytics-collector
        version: blue
    spec:
      containers:
      - name: analytics-collector
        image: binukx/analytics-collector:v2
        ports:
        - containerPort: 3004
        env:
        - name: CLICKHOUSE_HOST
          value: "http://clickhouse-service:8123"
        - name: CLICKHOUSE_USER
          value: "default"
        - name: CLICKHOUSE_PASSWORD
          value: ""
        - name: CLICKHOUSE_DB
          value: "analytics"
        - name: PORT
          value: "3004"
        resources:
          requests: { memory: "128Mi", cpu: "100m" }
          limits: { memory: "256Mi", cpu: "200m" }
        livenessProbe:
          httpGet: { path: /health, port: 3004 }
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet: { path: /health, port: 3004 }
          initialDelaySeconds: 15
          periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-collector-green
  namespace: analytics
  labels:
    app: analytics-collector
    version: green
spec:
  replicas: 0
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: analytics-collector
      version: green
  template:
    metadata:
      labels:
        app: analytics-collector
        version: green
    spec:
      containers:
      - name: analytics-collector
        image: binukx/analytics-collector:v2
        ports:
        - containerPort: 3004
        env:
        - name: CLICKHOUSE_HOST
          value: "http://clickhouse-service:8123"
        - name: CLICKHOUSE_USER
          value: "default"
        - name: CLICKHOUSE_PASSWORD
          value: ""
        - name: CLICKHOUSE_DB
          value: "analytics"
        - name: PORT
          value: "3004"
        resources:
          requests: { memory: "128Mi", cpu: "100m" }
          limits: { memory: "256Mi", cpu: "200m" }
        livenessProbe:
          httpGet: { path: /health, port: 3004 }
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet: { path: /health, port: 3004 }
          initialDelaySeconds: 15
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-collector-service
  namespace: analytics
spec:
  selector:
    app: analytics-collector
    version: blue
  ports:
  - protocol: TCP
    port: 3004
    targetPort: 3004
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: analytics-collector-hpa
  namespace: analytics
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: analytics-collector-blue
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70