apiVersion: apps/v1
kind: Deployment
metadata:
  name: metabase
  namespace: analytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metabase
  template:
    metadata:
      labels:
        app: metabase
        heavy: "true"
    spec:
      tolerations:
      - key: "dedicated"
        operator: "Equal"
        value: "metabase"
        effect: "NoSchedule"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - ip-192-168-15-212.ec2.internal
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  heavy: "true"
              topologyKey: kubernetes.io/hostname
      containers:
      - name: metabase
        image: metabase/metabase:latest
        ports:
        - containerPort: 3000
        env:
        - name: MB_DB_TYPE
          value: h2
        - name: MB_DB_FILE
          value: /metabase-data/metabase.db
        - name: JAVA_OPTS
          value: "-Xmx800m -Xms512m"
        resources:
          requests:
            memory: "600Mi"
            cpu: "200m"
          limits:
            memory: "1000Mi"
            cpu: "500m"
        volumeMounts:
        - name: metabase-data
          mountPath: /metabase-data
      volumes:
      - name: metabase-data
        persistentVolumeClaim:
          claimName: metabase-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: metabase
  namespace: analytics
spec:
  selector:
    app: metabase
  ports:
  - protocol: TCP
    port: 3000
    targetPort: 3000
  type: LoadBalancer