apiVersion: apps/v1
kind: Deployment
metadata:
  name: program-service-blue
  namespace: production
  labels:
    app: program-service
    version: blue
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: program-service
      version: blue
  template:
    metadata:
      labels:
        app: program-service
        version: blue
    spec:
      containers:
      - name: program-service
        image: binukx/program-service:v1
        ports:
        - containerPort: 3002
        env:
        - name: DB_HOST
          valueFrom:
            secretKeyRef: { name: db-secret, key: host }
        - name: DB_PORT
          valueFrom:
            secretKeyRef: { name: db-secret, key: port }
        - name: DB_NAME
          valueFrom:
            secretKeyRef: { name: db-secret, key: database }
        - name: DB_USER
          valueFrom:
            secretKeyRef: { name: db-secret, key: username }
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef: { name: db-secret, key: password }
        resources:
          requests: { memory: "128Mi", cpu: "100m" }
          limits: { memory: "256Mi", cpu: "200m" }
        livenessProbe:
          httpGet: { path: /health, port: 3002 }
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet: { path: /health, port: 3002 }
          initialDelaySeconds: 15
          periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: program-service-green
  namespace: production
  labels:
    app: program-service
    version: green
spec:
  replicas: 0
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: program-service
      version: green
  template:
    metadata:
      labels:
        app: program-service
        version: green
    spec:
      containers:
      - name: program-service
        image: binukx/program-service:v1
        ports:
        - containerPort: 3002
        env:
        - name: DB_HOST
          valueFrom:
            secretKeyRef: { name: db-secret, key: host }
        - name: DB_PORT
          valueFrom:
            secretKeyRef: { name: db-secret, key: port }
        - name: DB_NAME
          valueFrom:
            secretKeyRef: { name: db-secret, key: database }
        - name: DB_USER
          valueFrom:
            secretKeyRef: { name: db-secret, key: username }
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef: { name: db-secret, key: password }
        resources:
          requests: { memory: "128Mi", cpu: "100m" }
          limits: { memory: "256Mi", cpu: "200m" }
        livenessProbe:
          httpGet: { path: /health, port: 3002 }
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet: { path: /health, port: 3002 }
          initialDelaySeconds: 15
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: program-service
  namespace: production
spec:
  selector:
    app: program-service
    version: blue
  ports:
  - protocol: TCP
    port: 3002
    targetPort: 3002
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: program-service-hpa
  namespace: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: program-service-blue
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70